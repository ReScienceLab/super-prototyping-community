name: Index

on:
  push:
    branches: [main]
    paths: [projects/**]
  workflow_dispatch:

permissions:
  contents: write

concurrency: index

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # main as it is now, not the push that queued this run: a run queued behind another
          # would otherwise start from before that run's index commit, and its push be refused.
          ref: main
          fetch-depth: 0 # each project's last commit is its `updated`
      - run: python3 .github/community.py index
        env:
          GH_TOKEN: ${{ github.token }}
      - run: |
          git diff --quiet index.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update index.json" index.json
          git push
